name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build et tests
        run: ./gradlew build
        working-directory: webstream-fabric-mod
      - uses: actions/upload-artifact@v4
        with:
          name: webstream-mod
          path: webstream-fabric-mod/build/libs/*.jar
