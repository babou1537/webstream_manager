plugins {
    id 'fabric-loom' version '1.5.7'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    // Minecraft et Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Tâche pour synchroniser l'application Node.js depuis le répertoire parent
task syncNodeApp(type: Copy) {
    description = 'Synchronise les fichiers Node.js depuis webstream_manager vers les ressources du mod'

    // Copier src/
    from('../src') {
        into 'webstream-node/src'
        // Exclure les données utilisateur
        exclude '**/db/**'                    // Base de données avec les données
        exclude '**/*.db'
        exclude '**/*.db-shm'
        exclude '**/*.db-wal'
    }

    // Copier storage/ (structure vide uniquement, pas les fichiers uploadés)
    from('../storage') {
        into 'webstream-node/storage'
        exclude '**/*.mp4'                    // Vidéos
        exclude '**/*.png'                    // Images
        exclude '**/*.jpg'
        exclude '**/*.jpeg'
        exclude '**/*.gif'
        exclude '**/*.svg'
        exclude '**/*.webp'
        exclude '**/*.m3u8'                   // Streams
        exclude '**/*.ts'
        // Garder seulement les dossiers vides et .gitkeep si présent
        includeEmptyDirs = true
    }

    // Copier package.json
    from('../package.json') {
        into 'webstream-node'
    }

    // Copier node_modules (dépendances npm)
    from('../node_modules') {
        into 'webstream-node/node_modules'
    }

    into 'src/main/resources'

    // Exclure fichiers de dev
    exclude '**/.git/**'
    exclude '**/launch_*.bat'
    exclude '**/*.bak'
    exclude '**/.DS_Store'
}

// Exécuter syncNodeApp avant processResources
processResources.dependsOn syncNodeApp

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Ajouter la dépendance pour sourcesJar après sa création
tasks.named('sourcesJar') {
    dependsOn syncNodeApp
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }

    // Forcer l'inclusion de webstream-node dans le JAR
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

