plugins {
    id 'fabric-loom' version '1.5.7'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    // Minecraft et Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Copie le code de l'application Node.js (../src + package.json) vers build/, jamais vers src/main/resources.
// Sync supprime les fichiers périmés. Ne sont PAS embarqués : bases de données, images uploadées,
// node_modules (binaires natifs propres à l'OS, réinstallés par npm au premier lancement), permissions.json.
task syncNodeApp(type: Sync) {
    description = "Prépare l'application Node.js à embarquer dans le JAR"

    into layout.buildDirectory.dir('generated/node-app')

    from('../src') {
        into 'webstream-node/src'
        exclude 'db/**'
        exclude '**/*.db', '**/*.db-shm', '**/*.db-wal'
        exclude '**/*.bak'
        exclude 'permissions.json'
        exclude '**/.DS_Store'
    }

    from('../package.json') {
        into 'webstream-node'
    }
    from('../package-lock.json') {
        into 'webstream-node'
    }
}

processResources {
    inputs.property "version", project.version

    // Repartir d'un dossier propre : aucun fichier périmé d'un ancien build ne doit finir dans le JAR
    doFirst {
        delete layout.buildDirectory.dir('resources/main/webstream-node')
    }

    from(syncNodeApp)

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }

    // Forcer l'inclusion de webstream-node dans le JAR
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

