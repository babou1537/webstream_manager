plugins {
    id 'fabric-loom' version '1.5.7'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    // Minecraft et Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Tests (le cœur et le serveur web n'utilisent aucune classe Minecraft)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }

    // Forcer l'inclusion de webstream-node dans le JAR
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


// Interface web hors Minecraft, pour la développer : gradlew runWeb --args="dossier port export.json dossier-images"
tasks.register('runWeb', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.babou.webstream.DevServer'
    standardInput = System.in
}
